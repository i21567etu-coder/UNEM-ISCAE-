<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMN Calcvalide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors duration-300">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        
        <header class="flex justify-between items-center mb-10 border-b pb-4 dark:border-slate-800">
            <div>
                <h1 class="text-3xl font-extrabold text-GREEN-600 dark:text-GREEN-400 mb-1">UNEM ISCAE</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400"></p>
            </div>
            <button id="themeToggle" class="p-2.5 rounded-lg bg-slate-200 dark:bg-slate-800 hover:ring-2 hover:ring-blue-400 transition">
                <span id="themeToggleIcon" class="text-xl">🌙</span>
            </button>
        </header>

        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/50 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Filiere</label>
                    <select id="specialtySelect" class="w-full p-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 font-medium focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="IG">IG </option>
                        <option value="DI">DI</option>
                        <option value="RT">RT</option>
                        <option value="BA">BA</option>
                        <option value="FC">FC</option>
                        <option value="GRH">GRH</option>
                        <option value="TCM">TCM</option>
                        <option value="SAE">SAE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Niveau</label>
                    <select id="levelSelect" class="w-full p-3 border border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 font-medium focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="L1">L1</option>
                        <option value="L2">L2</option>
                        <option value="L3">L3</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="loadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all transform active:scale-95">
                        Start
                    </button>
                </div>
            </div>
        </div>

        <div id="semesterTablesContainer" class="hidden space-y-10"></div>

        <div id="finalResultBox" class="mt-8 p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 hidden text-center">
    <h3 class="text-xl font-extrabold text-slate-800 dark:text-slate-200 mb-4">Résultat Annuel </h3>
    
    <button id="btnCalcYearly" class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-3 px-8 rounded-xl text-base shadow-md transition transform active:scale-95 mb-6">
        🧮 Calculer Moyenne Générale
    </button>

    <p id="yearlyErrorMsg" class="text-amber-600 dark:text-amber-400 font-bold text-sm mb-4 hidden">
        ⚠️ Veuillez remplir toutes les notes des matières pour S1 et S2 avant de calculer !
    </p>

    <div id="yearlyStatsWrapper" class="hidden space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                <span class="text-sm text-slate-500 block">Moyenne S1</span>
                <span id="resS1" class="text-xl font-bold text-slate-400">-</span>
                <span id="statusS1" class="block text-xs mt-1 font-semibold text-slate-400">-</span>
            </div>
            <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                <span class="text-sm text-slate-500 block">Moyenne S2</span>
                <span id="resS2" class="text-xl font-bold text-slate-400">-</span>
                <span id="statusS2" class="block text-xs mt-1 font-semibold text-slate-400">-</span>
            </div>
        </div>

        <div id="yearBoxWrapper" class="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl text-center border dark:border-slate-800">
            <span class="text-sm text-slate-500 font-bold block mb-1">Moyenne Générale</span>
            <span id="resYear" class="text-2xl font-black text-blue-600 dark:text-blue-400">0.00</span>
            <div class="text-xs text-slate-400 mt-1 font-medium">Crédits Annuels Requis: <span id="yearCredits" class="font-bold">0</span> / 60</div>
        </div>

        <div id="academicStatus" class="text-lg font-bold text-center p-4 rounded-xl text-slate-400 bg-slate-100 dark:bg-slate-900">
            -
        </div>
    </div>
</div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <footer class="mt-12 pb-6 text-center border-t border-slate-200 dark:border-slate-700/50 pt-6">
    <p class="text-base font-medium text-slate-600 dark:text-slate-400 animate-pulse">
        ✨ وفقنا الله وإياكم لما يحبه ويرضاه .. لا تنسونا من صالح الدعاء ✨
    </p>
</footer>
</body>
</html>
